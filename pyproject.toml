[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aspgapv3"
version = "0.1.0"
description = "Gaia XP -> APOGEE-scale Teff, logg, [M/H], [alpha/M] plus M_G and A0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "torch",
]

[project.optional-dependencies]
# used by scripts/, not by the training loop itself
build = ["astropy", "pyarrow", "gaiaxpy", "h5py"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
