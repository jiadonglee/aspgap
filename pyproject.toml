[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aspgapv3"
version = "0.1.0"
description = "Gaia XP -> APOGEE-scale Teff, logg, [M/H], [alpha/M] plus M_G and A0"
requires-python = ">=3.10"
dependencies = [          # inference only needs these three
    "numpy",
    "pandas",
    "torch",
]

[project.optional-dependencies]
predict = ["pyarrow", "astropy"]            # parquet / FITS input and output
fetch = ["pyarrow", "astropy", "astroquery"]  # + fetch XP coefficients from the Gaia archive by source_id
# training and dataset building (scripts/), not needed for prediction
build = ["pyyaml", "astropy", "pyarrow", "gaiaxpy", "h5py"]
test = ["pytest", "pyarrow", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
