run:
  name: specclip_frozen_v1
  seed: 42
  out_dir: runs
  device: cuda
data:
  root: data/processed/aspcap_v0.6.0
  input: xp343
  teff_variant: raw
  snr_min: 50.0
  teff_max: 8000.0
  dedupe: max_snr
  splits:
    train: 0.9
    val: 0.05
    test: 0.05
    sky_test_groups: 32
    seed: 42
labels:
  chem:
  - alpha_m
  - fe_h
  - mg_h
  atm:
  - teff
  - logg
  - m_h
  teff_variant: raw
  mask_warn_bits: true
  sigma_floor:
    teff: 50.0
    logg: 0.05
    m_h: 0.02
    alpha_m: 0.02
    fe_h: 0.02
    mg_h: 0.02
  weight_atm: 0.5
model:
  encoder:
    type: specclip
    ckpt_path: /nexus/posix0/MIA-astro-env/hxr/jdli/gaiaworld/specclip_assets/xp_encoder.ckpt
    unfreeze_last_k: 0
    embed_dim: 768
  trunk:
    dim: 256
    dropout: 0.1
train:
  epochs: 60
  batch_size: 256
  num_workers: 4
  lr_head: 0.0003
  lr_enc: 0.0
  weight_decay: 0.01
  warmup_epochs: 3
  grad_clip: 1.0
  amp: true
  early_stop_patience: 12
  logvar_clamp:
  - -8.0
  - 8.0
  sampler:
    type: binned
    power: 0.5
    bins:
      teff: 300.0
      logg: 0.5
      m_h: 0.25
eval:
  ood_k: 8
  ood_max_train: 200000
