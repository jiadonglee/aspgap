# Benchmark 2/4: transformer on 343-pixel XP, random init. Answers whether any
# gain from SpecCLIP is pretraining, or just the architecture + input format.
inherit: base.yaml

run:
  name: scratch_stageA

model:
  encoder:
    type: scratch
    embed_dim: 768
    d_model: 256
    n_layers: 4
    n_heads: 4
    dropout: 0.1
    unfreeze_last_k: -1

train:
  lr_enc: 3.0e-4
