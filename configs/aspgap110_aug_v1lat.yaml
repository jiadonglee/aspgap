# aspgap110_aug + auxiliary distillation of the original AspGap v1 1024-d latent
# (output of v1's first network xp2_lat on v1-preprocessed CLEAN coefficients,
# scripts/build_v1_latent.py). The target is always the latent of the clean star,
# also when the training input is noise-augmented: the model is asked to reproduce
# clean-star representations from degraded input. Labels are unchanged. Latent head =
# 1-hidden-layer MLP on the trunk feature z; MSE on the standardized latent (fp32).
# CAVEAT: the teacher was trained on DR17 stars, some of which are in our test sets
# (latents are only used as targets on train rows, but the teacher saw those stars).
inherit: aspgap110_aug.yaml

run:
  name: aspgap110_aug_v1lat

model:
  latent_head:
    source: v1_latent
    dim: 1024
    hidden: 512
    weight: 1.0
