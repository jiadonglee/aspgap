# aspgap110_aug with a uniform (random) training sampler instead of the binned
# power-0.5 label-balanced one. Question: is the balanced sampler what costs
# bulk-star (clean, bright) precision relative to AspGap v1?
inherit: aspgap110_aug.yaml

run:
  name: aspgap110_aug_rand

train:
  sampler:
    type: random
