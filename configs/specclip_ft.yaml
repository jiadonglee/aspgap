# Benchmark 4/4 + Stage B: partial fine-tuning. Unfreeze the last 2 transformer
# blocks (+ final layernorm) of the SpecCLIP encoder at a 30x lower LR than the
# heads. Expected best overall model; escalate to Stage C (unfreeze_last_k: -1,
# lr_enc 1e-6..3e-6) only if this still underfits.
inherit: base.yaml

run:
  name: specclip_ft_last2

model:
  encoder:
    type: specclip
    ckpt_path: null
    unfreeze_last_k: 2

train:
  lr_enc: 1.0e-5
  epochs: 40
