# Shared defaults. Override per run with `python scripts/train.py --config X.yaml --set train.epochs=50`.
# Also read by scripts/build_dataset.py (data.* and labels.* keys).

run:
  name: base
  seed: 42
  out_dir: runs
  device: cuda          # falls back to cpu automatically

data:
  root: data/processed/aspcap_v0.6.0
  input: coef110n       # network input: G-normalized, RobustScaled BP/RP coefficients (AspGap v1 convention)
  teff_variant: raw     # raw | calibrated (calibrated embeds XP photometry via IRFM!)
  snr_min: 50.0
  teff_max: 8000.0
  require_xp_valid: true   # drop rows with xpcov_valid==False from every split (needs build_xp_noise.py)
  dedupe: max_snr       # one row per gaia_dr3_source_id
  splits:
    train: 0.90
    val: 0.05
    test: 0.05
    sky_test_groups: 32 # spherical-kmeans groups held out whole
    seed: 42

labels:
  atm: [teff, logg, m_h]
  chem: [alpha_m]
  mask_warn_bits: true   # element flag bits 9-11 (warn grid edge / teff / m_h) also mask
  # per-label sigma floors (raw units): keep tiny formal ASPCAP errors from dominating the NLL.
  # (build_dataset.py always stores teff, logg, m_h, alpha_m, fe_h, mg_h; only atm + chem are trained.)
  sigma_floor:
    teff: 50.0
    logg: 0.05
    m_h: 0.02
    alpha_m: 0.02
    fe_h: 0.02
    mg_h: 0.02

model:
  encoder:
    embed_dim: 768       # MLP encoder output / trunk input
  trunk:
    dim: 256
    dropout: 0.1

train:
  epochs: 60
  batch_size: 256
  num_workers: 4
  lr_head: 3.0e-4
  lr_enc: 3.0e-4
  weight_decay: 1.0e-2
  warmup_epochs: 3
  grad_clip: 1.0
  amp: true
  amp_dtype: bf16      # bf16 | fp16
  early_stop_patience: 12
  logvar_clamp: [-8.0, 8.0]

eval:
  amp: false           # evaluation in fp32
  ood_k: 8
  ood_max_train: 200000
