# v2: frozen SpecCLIP + stats-token pooling.
# v1 finding: mean-pooling dilutes the stats token (1/344), which carries the
# per-spectrum mean/std of the 550nm-normalized flux -- the broad continuum
# shape the backbone's internal per-pixel standardization removes. v1 lost to
# the coef110n baseline everywhere; this tests whether continuum info is the
# reason.
inherit: base.yaml

run:
  name: specclip_frozen_v2

model:
  encoder:
    type: specclip
    ckpt_path: null
    unfreeze_last_k: 0
    pooling: mean_plus_stats   # -> 1536-d

train:
  lr_enc: 0.0
