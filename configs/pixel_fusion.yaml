# Pixel-space fusion (DR4 prep): SpecCLIP (last-2 blocks unfrozen) + attention
# pooling, FiLM conditioning on absolute-flux scalars + the XP noise channel,
# and noise-matched augmentation that degrades bright APOGEE stars to
# faint-star noise. Needs scripts/build_xp_noise.py outputs in data.root.
inherit: base.yaml

run:
  name: pixel_fusion

model:
  encoder:
    type: specclip
    ckpt_path: null
    unfreeze_last_k: 2
    pooling: attn
    attn_queries: 4
    attn_heads: 2
  side:
    scalars: [log_flux550, log_snr550]   # XP-derived only (non-negotiable 4)
    noise_channel: true

train:
  lr_enc: 1.0e-5
  epochs: 40
  amp_dtype: bf16
  select_on: mean            # clean | degraded | mean (checkpoint + early stop)
  augment:
    noise_match:
      p: 0.5
      g_target: catalog_hist     # catalog_hist | uniform
      g_max: 17.65
